name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # xgboost's prebuilt macOS wheel dlopen's libomp at runtime; the runner
      # image does not ship it. Install it so `import xgboost` works.
      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-sync pytest -q

  # The SQL suite (test/sql/*.test) through the published haybarn-unittest and the
  # signed community `vgi` extension, over every transport (ci/run-integration.sh,
  # adapted from the vgi-starter template): stdio (DuckDB spawns the worker per
  # connection), launch (DuckDB starts it once on an AF_UNIX socket and pools
  # connections) and http (the worker serves --http).
  integration:
    name: SQL E2E (${{ matrix.transport }}) on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        transport: [stdio, launch, http]
    env:
      UV_PYTHON: "3.14"
      HAYBARN_VERSION: "2.0.1rc3"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build the worker
        run: uv sync --locked --all-extras

      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"

      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          WORKER="$PWD/.venv/bin/vgi-explain" \
          HAYBARN_UNITTEST="$PWD/.tools/bin/haybarn-unittest" \
          TRANSPORT=${{ matrix.transport }} ci/run-integration.sh

  metadata-quality:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    env:
      # uv otherwise picks the newest CPython (3.15), which lacks wheels for native deps.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install the worker
        run: uv sync --extra dev --python 3.14

      - name: vgi-lint
        uses: Query-farm/vgi-lint-check@v2
        with:
          # Lint the installed console script in the project venv — NOT
          # `uv run explain_worker.py`, whose PEP-723 script env caches a stale
          # SDK and emits the old catalog schema (a false schema-mismatch).
          location: ".venv/bin/vgi-explain"
          fail-on: info

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # uv otherwise picks the newest CPython (3.15), which lacks wheels for native deps.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --extra dev --python 3.14

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Check linting
        run: uv run --no-sync ruff check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy vgi_explain/

      - name: Docstring lint (pydoclint)
        run: uvx pydoclint --config pyproject.toml vgi_explain/
