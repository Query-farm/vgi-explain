line-length = 120
target-version = "py313"
builtins = ["con", "families", "chosen", "input_summary", "fit_summary", "checks", "local_summary", "waterfall", "comparison"]
extend-exclude = ["artifacts", "validation", ".vgi-examples"]

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

[lint.per-file-ignores]
"*.ipynb" = ["E501"]

[lint.pydocstyle]
convention = "google"
